services:
  mathmaster:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - mathmaster-data:/app/data
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-secret-change-me-0123456789abcdef}
      # 两个服务必须指向同一个数据库，否则数据静默分裂
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/math_tutor.db}
    restart: unless-stopped

  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - mathmaster-data:/app/data
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-secret-change-me-0123456789abcdef}
      # 空串会覆盖 SQLite 默认值导致启动崩溃，这里兜底为容器内 SQLite
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/math_tutor.db}
      REDIS_URL: ${REDIS_URL:-}
    # 覆盖镜像级 HEALTHCHECK（那是 Streamlit 的 8501 端口检查，对 uvicorn 必然失败）
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  # 可选：异步任务队列（REDIS_URL=redis://redis:6379/0 + RQ Worker）
  # docker compose --profile queue up -d redis worker
  redis:
    image: redis:7-alpine
    profiles: ["queue"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

  worker:
    build: .
    command: python -m backend.jobs.worker
    profiles: ["queue"]
    volumes:
      - mathmaster-data:/app/data
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_API_KEY: ${AI_API_KEY:-}
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-secret-change-me-0123456789abcdef}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/math_tutor.db}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

  # 可选：生产/演示用 MySQL。默认 SQLite 即可运行。
  # mysql:
  #   image: mysql:8.4
  #   environment:
  #     MYSQL_ROOT_PASSWORD: root
  #     MYSQL_DATABASE: math_tutor
  #     MYSQL_USER: mathmaster
  #     MYSQL_PASSWORD: mathmaster
  #   volumes:
  #     - mysql-data:/var/lib/mysql
  #   restart: unless-stopped

  # 可选：PostgreSQL（Batch 09 兼容目标）。docker compose --profile postgres up -d postgres
  # 应用侧连接示例：DATABASE_URL=postgresql+psycopg2://mathmaster:mathmaster@localhost:5433/math_tutor
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: mathmaster
      POSTGRES_PASSWORD: mathmaster
      POSTGRES_DB: math_tutor
    ports:
      - "5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mathmaster -d math_tutor"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  mathmaster-data:
  # mysql-data:
  pg-data:
  redis-data:
