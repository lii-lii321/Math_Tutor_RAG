name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install ruff & import-linter
        run: pip install ruff import-linter
      - name: Lint
        run: ruff check .
      - name: Import contracts (layering gate)
        run: lint-imports

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt pytest-cov
      - name: Run tests with coverage
        # 测试环境由 tests/conftest.py 统一接管（无条件置 RAG_ENABLED=true、
        # AI_PROVIDER=mock），检索金标门禁（含真实 ChromaDB 向量检索）在本 job
        # 实跑；这里不再重复声明环境变量，避免与 conftest 的覆盖顺序形成
        # 误导性死配置（外审 2026-10-25 曾据此误判 CI 必然失败）。
        run: pytest -q --cov=backend --cov=api --cov-report=term-missing --cov-fail-under=78

  boot-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Boot Streamlit & check health
        run: |
          python -m streamlit run app.py --server.port 8601 --server.headless true &
          timeout 90 bash -c 'until curl -sf http://localhost:8601/_stcore/health; do sleep 2; done'
      - name: Boot API & check health
        run: |
          python -m uvicorn api.main:app --port 8000 &
          timeout 90 bash -c 'until curl -sf http://localhost:8000/health; do sleep 2; done'
      - name: Install Playwright & pytest
        run: pip install pytest playwright && playwright install --with-deps chromium
      - name: Print frontend dep versions
        run: pip show streamlit streamlit-antd-components streamlit-agraph | grep -E "Name|Version"
      - name: Run E2E smoke (against running app)
        env:
          MM_E2E: "1"
          MM_E2E_BASE_URL: http://localhost:8601
        run: pytest tests/e2e -q -m e2e
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failures
          path: e2e_failure*.png
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t mathmaster-edu:ci .
