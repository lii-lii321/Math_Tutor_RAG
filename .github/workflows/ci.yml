name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt pytest-cov
      - name: Run tests with coverage
        env:
          AI_PROVIDER: mock
          RAG_ENABLED: "false"
        run: pytest -q --cov=backend --cov=api --cov-report=term-missing

  boot-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Boot Streamlit & check health
        run: |
          python -m streamlit run app.py --server.port 8601 --server.headless true &
          timeout 90 bash -c 'until curl -sf http://localhost:8601/_stcore/health; do sleep 2; done'
      - name: Boot API & check health
        run: |
          python -m uvicorn api.main:app --port 8000 &
          timeout 90 bash -c 'until curl -sf http://localhost:8000/health; do sleep 2; done'

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t mathmaster-edu:ci .
